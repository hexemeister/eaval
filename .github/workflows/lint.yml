name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: 🔍 Check and install missing package
        run: |
          echo "Verificando pacotes ausentes..."
          npm list @space-man/react-theme-animation || npm install @space-man/react-theme-animation


      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      - name: Run Tests
        run: php artisan test
        env:
          APP_KEY: base64:Nu7UlNN14C4IzsUqHogmLXsg9apYWlraCdJ9kUuJ8e0=

      # - name: Commit Changes
