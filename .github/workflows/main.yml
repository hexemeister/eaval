on:
  push:
    branches:
      - main
name: 🚀 Build and Deploy website on push
jobs:
  web-deploy:
    name: 🐧 Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: 📦 Install Node.js dependencies
        run: npm install

      - name: 🛠️ Build assets
        run: npm run build

      - name: ⚡ Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 📂 Prepare deployment files
        run: |
          mkdir -p deploy
          # Criar estrutura de diretórios necessária
          mkdir -p deploy/bootstrap
          mkdir -p deploy/bootstrap/cache
          
          # Copiar arquivos essenciais
          cp -r public/* deploy/
          cp -r vendor deploy/
          cp artisan deploy/
          cp bootstrap/app.php deploy/bootstrap/
          
          # Copiar .env.example apenas se existir
          if [ -f .env.example ]; then
            cp .env.example deploy/.env
          fi
          
          # Remover arquivos desnecessários (apenas se existirem)
          [ -d deploy/node_modules ] && rm -rf deploy/node_modules
          [ -d deploy/.git ] && rm -rf deploy/.git
          [ -d deploy/tests ] && rm -rf deploy/tests
          [ -f deploy/.env.example ] && rm deploy/.env.example
          
          # Definir permissões
          find deploy/ -type d -exec chmod 755 {} \;
          find deploy/ -type f -exec chmod 644 {} \;

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          server-dir: /apps/eaval/
          local-dir: deploy/
          exclude: ""