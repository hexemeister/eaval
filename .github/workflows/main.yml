name: 🚀 Build and Deploy website on push
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-php-mysql:
    name: 🧪 Testes PHP (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eaval_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 🏷️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: 📦 Instalar dependências Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 📂 Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🗄️ Rodar migrate:fresh no MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eaval_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate:fresh --env=testing --no-interaction

      - name: 🧪 Rodar testes PHP (MySQL)
        run: ./vendor/bin/pest --configuration phpunit.mysql.ci.xml

  web-deploy:
    name: 🐧 Build and Deploy
    runs-on: ubuntu-latest
    needs: test-php-mysql
    steps:
      - name: 🏷️ Get latest code
        uses: actions/checkout@v4

      - name: 💾 Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: 📦 Install Node.js dependencies
        run: npm ci

      - name: 🔍 Debug package issue
        run: |
          npm list @space-man/react-theme-animation || npm install @space-man/react-theme-animation --save || echo "Falha ao instalar @space-man/react-theme-animation"

      - name: 📂 Prepare .env for production
        run: |
          # Criar pasta de deploy
          mkdir -p deploy
          cp .env.example deploy/.env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}" >> deploy/.env
          echo "RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}" >> deploy/.env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> deploy/.env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> deploy/.env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> deploy/.env
          echo "MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}" >> deploy/.env
          cp deploy/.env .env

      - name: 🛠️ Build assets
        run: npm run build
        env:
          NODE_ENV: production  # Adicionado: Otimiza os assets para produção

      - name: 📂 Prepare deployment files
        run: |
          # Copiar arquivos do projeto, excluindo a pasta deploy/
          rsync -av --exclude='deploy' --exclude='node_modules' --exclude='.git' --exclude='tests' --exclude='.env.example' --exclude='.gitignore' . deploy/
          
          # Definir permissões
          find deploy/ -type d -exec chmod 755 {} \;
          find deploy/ -type f -exec chmod 644 {} \;
          chmod +x deploy/artisan

      - name: 📂 Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          protocol: ftp
          server-dir: /apps/eaval/
          local-dir: deploy/
          exclude: |
            .git/**
            node_modules/**
            tests/**
            .env.example
            .gitignore
          dangerous-clean-slate: false