on:
  push:
    branches:
      - main
name: 🚀 Build and Deploy website on push
jobs:
  web-deploy:
    name: 🐧 Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Get latest code
        uses: actions/checkout@v4

      # Cache para dependências PHP
      - name: 💾 Cache PHP dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Cache para dependências Node.js
      - name: 💾 Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: 📦 Install Node.js dependencies
        run: npm install

      - name: 🔍 Check and install missing package
        run: |
          echo "Verificando pacotes ausentes..."
          npm list @space-man/react-theme-animation || npm install @space-man/react-theme-animation

      - name: 🛠️ Build assets
        run: npm run build

      - name: ⚡ Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 📂 Prepare deployment files
        run: |
          # Criar estrutura básica
          mkdir -p deploy/{bootstrap,public}
          
          # Copiar arquivos essenciais com tratamento de erro
          cp -r public/* deploy/public/ 2>/dev/null || true
          cp -r vendor deploy/ 2>/dev/null || true
          cp artisan deploy/ 2>/dev/null || true
          cp bootstrap/app.php deploy/bootstrap/ 2>/dev/null || true
          
          # Copiar .env se existir
          [ -f .env.example ] && cp .env.example deploy/.env
          
          # Remover arquivos desnecessários (apenas se existirem)
          [ -d deploy/node_modules ] && rm -rf deploy/node_modules
          [ -d deploy/.git ] && rm -rf deploy/.git
          [ -d deploy/tests ] && rm -rf deploy/tests
          [ -f deploy/.env.example ] && rm deploy/.env.example
          
          # Definir permissões com tratamento de erro
          find deploy/ -type d -exec chmod 755 {} \; 2>/dev/null || true
          find deploy/ -type f -exec chmod 644 {} \; 2>/dev/null || true
          
          # Garantir permissões específicas para arquivos importantes
          chmod +x deploy/artisan 2>/dev/null || true

      - name: 📦 Compress files for faster upload
        run: tar -czf deploy.tar.gz deploy/

      - name: 📂 Upload and extract via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          server-dir: /apps/eaval/
          local-dir: deploy/
          exclude: ""
          delete: true
          dangerous-clean-slate: true