name: 🚀 Build and Deploy website on push
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: 🐧 Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Get latest code
        uses: actions/checkout@v4

      - name: 💾 Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: 📦 Install Node.js dependencies
        run: npm ci  # Mais confiável que npm install

      - name: 🔍 Debug package issue
        run: |
          npm list @space-man/react-theme-animation || npm install @space-man/react-theme-animation --save || echo "Falha ao instalar @space-man/react-theme-animation"

      - name: 🛠️ Build assets
        run: npm run build

      - name: 📂 Prepare deployment files
        run: |
          # Criar pasta de deploy
          mkdir -p deploy
          
          # Copiar todos os arquivos do projeto
          cp -r . deploy/
          
          # Remover arquivos desnecessários
          rm -rf deploy/node_modules
          rm -rf deploy/.git
          rm -rf deploy/tests
          rm -f deploy/.env.example
          rm -f deploy/.gitignore
          
          # Definir permissões
          find deploy/ -type d -exec chmod 755 {} \;
          find deploy/ -type f -exec chmod 644 {} \;
          chmod +x deploy/artisan

      - name: 📂 Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          server-dir: /apps/eaval/
          local-dir: deploy/
          exclude: |
            .git/**
            node_modules/**
            tests/**
            .env.example
            .gitignore
          dangerous-clean-slate: false  # Evita apagar .env ou outros arquivos existentes